x-laravel-env: &laravel-env
  DB_HOST: db
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:-fiberpulse}"
  DB_USERNAME: "${DB_USERNAME:-sail}"
  DB_PASSWORD: "${DB_PASSWORD:-secret}"
  REDIS_HOST: redis

services:

  # ─── Aplicación principal (Laravel + php artisan serve) ───
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/public/build
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *laravel-env
      RUN_SETUP: "1"
      PHP_CLI_SERVER_WORKERS: "30"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000", "--no-reload"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  # ─── Worker de colas (análisis IA de rutina) ───
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/public/build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *laravel-env
    command:
      - sh
      - -c
      - |
        until [ -f vendor/autoload.php ] && grep -q '^APP_KEY=base64' .env 2>/dev/null && php artisan migrate:status >/dev/null 2>&1; do sleep 3; done
        exec php artisan queue:work --tries=3 --timeout=60
    depends_on:
      - app

  # ─── Collector de telemetría (bucle cada 5s) ───
  collector:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - /var/www/html/public/build
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *laravel-env
    command:
      - sh
      - -c
      - |
        until [ -f vendor/autoload.php ] && grep -q '^APP_KEY=base64' .env 2>/dev/null && php artisan migrate:status >/dev/null 2>&1; do sleep 3; done
        exec php artisan telemetry:collect
    depends_on:
      - app

  # ─── Base de datos MySQL 8 ───
  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-fiberpulse}"
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_USER: "${DB_USERNAME:-sail}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ─── Redis (colas y caché) ───
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # ─── phpMyAdmin (administración visual de BD) ───
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
    driver: local